<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подготовка к экзамену</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <style>
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .markdown-section { max-width: 1060px; }
    .markdown-section h1 { font-size: 2rem; }
    .markdown-section h2 { margin-top: 44px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
    .markdown-section h3 { margin-top: 30px; }
    .markdown-section blockquote { border-left: 4px solid #2563eb; background: #f8fafc; padding: 8px 14px; color: #111827; }
    .markdown-section details { border: 1px solid #e5e7eb; border-radius: 12px; padding: 14px 16px; margin: 12px 0 26px; background: #ffffff; }
    .markdown-section summary { cursor: pointer; color: #0f172a; }
    .markdown-section table { display: table; width: 100%; font-size: 0.96rem; }
    .markdown-section code { font-size: 0.95em; white-space: nowrap; }
    .markdown-section li { margin: 4px 0; }
    .mermaid { text-align: center; margin: 20px 0; padding: 10px; background: #fafafa; border: 1px solid #e5e7eb; border-radius: 12px; }
  </style>
</head>
<body>
  <div id="app">Загрузка...</div>
  <script>
    window.$docsify = {
      name: 'Подготовка к экзамену',
      loadSidebar: false,
      executeScript: true,
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      },
      plugins: [
        function(hook) {
          hook.doneEach(function() {
            if (window.mermaid) {
              window.mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: 'default' });
              window.mermaid.run({ querySelector: '.mermaid' });
            }
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</body>
</html>
